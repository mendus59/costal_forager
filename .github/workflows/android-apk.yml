name: Android APK

# Builds an installable Android APK (release build, sideloadable) without an
# Expo account: generates the native project with `expo prebuild` and runs
# Gradle. The APK is attached to the run and published to the rolling
# "android-latest" pre-release, so it can be downloaded straight to a phone.
# The release holds the versioned APK and an identical copy named
# coastal-forager.apk, so links to
# releases/download/android-latest/coastal-forager.apk never go stale.
#
# Signing uses the debug keystore from the Expo template, which is the same on
# every build, so a newer APK installs over an older one. It is fine for
# sideloading but not for the Play Store, which needs a private upload key.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - package-lock.json
      - .github/workflows/android-apk.yml
  pull_request:
    paths:
      - apps/mobile/**
      - packages/**
      - package-lock.json
      - .github/workflows/android-apk.yml

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci

      - name: Generate the native Android project
        working-directory: apps/mobile
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install

      # The version is app.json's "version" plus the run number, e.g. 1.0.0.42,
      # and appears in the APK's file name and in Android's app info.
      - name: Work out the version
        id: version
        run: |
          v="$(node -p "require('./apps/mobile/app.json').expo.version").${{ github.run_number }}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "apk=coastal-forager-$v.apk" >> "$GITHUB_OUTPUT"
          echo "stable=coastal-forager.apk" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: |
          # Each build gets a higher versionCode so Android accepts it as an update.
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "${{ steps.version.outputs.version }}"/' app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/${{ steps.version.outputs.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: coastal-forager-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.apk }}

      - name: Publish to the android-latest pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.version.outputs.apk }}
          STABLE: ${{ steps.version.outputs.stable }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "$APK" "$STABLE"
          notes="Version $VERSION, built from ${GITHUB_SHA::7}. Download $STABLE (or $APK, the same build) on your Android phone and open it to install."
          git tag -f android-latest && git push -f origin android-latest
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$notes" --prerelease
            # Upload first, so the fixed-name link never 404s mid-publish, then keep only the newest build.
            gh release upload android-latest "$APK" "$STABLE" --clobber
            for old in $(gh release view android-latest --json assets -q '.assets[].name' | grep '\.apk$'); do
              [ "$old" = "$APK" ] || [ "$old" = "$STABLE" ] || gh release delete-asset android-latest "$old" --yes
            done
          else
            gh release create android-latest "$APK" "$STABLE" --title "Android APK (latest)" --notes "$notes" --prerelease
          fi
