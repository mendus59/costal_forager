name: Android APK

# Builds an installable Android APK (release build, sideloadable) without an
# Expo account: generates the native project with `expo prebuild` and runs
# Gradle. The APK is attached to the run and published to the rolling
# "android-latest" pre-release, so it can be downloaded straight to a phone.
#
# Signing uses the debug keystore from the Expo template, which is the same on
# every build, so a newer APK installs over an older one. It is fine for
# sideloading but not for the Play Store, which needs a private upload key.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - package-lock.json
      - .github/workflows/android-apk.yml

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci

      - name: Generate the native Android project
        working-directory: apps/mobile
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: |
          # Each build gets a higher versionCode so Android accepts it as an update.
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/coastal-forager.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: coastal-forager-apk
          path: coastal-forager.apk

      - name: Publish to the android-latest pre-release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7} (run ${{ github.run_number }}). Download coastal-forager.apk on your Android phone and open it to install."
          git tag -f android-latest && git push -f origin android-latest
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$notes" --prerelease
            gh release upload android-latest coastal-forager.apk --clobber
          else
            gh release create android-latest coastal-forager.apk --title "Android APK (latest)" --notes "$notes" --prerelease
          fi
