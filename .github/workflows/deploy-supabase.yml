name: Deploy Supabase

# Deploys schema, seed, edge functions, first syncs, cron jobs and the
# sign-in email templates to the Supabase project. Uses the repository
# secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and
# SUPABASE_SERVICE_ROLE_KEY, plus RESEND_API_KEY and EMAIL_FROM for sign-in
# email through Resend SMTP.
# Run it from the Actions tab (Run workflow) once this file is on main.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-fbagwo]

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; missing=1; fi
          done
          exit $missing
      - name: Deploy schema, functions and jobs
        run: scripts/deploy-supabase.sh
      - name: Set sign-in email templates
        run: scripts/set-auth-email-templates.sh
