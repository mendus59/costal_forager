name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.x
      - name: Typecheck edge functions
        run: |
          mkdir -p /tmp/dcheck && echo '{"nodeModulesDir":"auto"}' > /tmp/dcheck/deno.json
          deno check --config /tmp/dcheck/deno.json supabase/functions/*/index.ts

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and seed
        run: |
          P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          $P -c "create schema auth; create table auth.users (id uuid primary key); create function auth.uid() returns uuid language sql stable as 'select null::uuid';"
          for f in supabase/migrations/*.sql; do $P -f "$f"; done
          $P -f supabase/seed.sql
          $P -c "select count(*) from species"
